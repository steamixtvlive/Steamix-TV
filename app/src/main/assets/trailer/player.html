<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
/* YouTube oynatici arayuzunu gizlemek icin kucuk bir yakinlastirma yapilir;
   %200 yakinlastirma videoyu kirpiyor ve "hizli" gorunmesine yol aciyordu. */
#player { position: absolute; top: 50%; left: 50%; width: 132%; height: 132%; transform: translate(-50%, -50%); }
video { filter: brightness(1.06) contrast(1.05) saturate(1.08); }
/* Beyaz "baslat" butonu / duraklatma perdesi / bitis ekrani gorunmesin.
   Videonun tam ekran kesintisiz surmesi icin bunlar gizlenir. */
.ytp-large-play, .ytp-pause-overlay, .ytp-endscreen-content,
.ytp-ce-element, .ytp-chrome-bottom, .ytp-chrome-top,
.ytp-gradient-bottom, .ytp-gradient-top, .ytp-error, .ytp-welcome {
  display: none !important;
}
html.ytp-android-app, .ytp-android-app { display: none !important; }
</style>
</head>
<body>
<div id="player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var __playing = false;
var __player = null;
var __redirected = false;
var __playRequested = false;

function slog(m) { try { Android.log(m); } catch (e) {} }

// YouTube iframe yeniden olusturdugu arayuz katmanlarini gizle.
function hideOverlays() {
  try {
    var style = document.getElementById('__nf_style');
    if (!style) {
      style = document.createElement('style');
      style.id = '__nf_style';
      style.innerHTML = '.ytp-large-play,.ytp-pause-overlay,.ytp-endscreen-content,' +
        '.ytp-ce-element,.ytp-chrome-bottom,.ytp-chrome-top,.ytp-gradient-bottom,' +
        '.ytp-gradient-top,.ytp-error,.ytp-welcome{display:none !important;}';
      (document.head || document.documentElement).appendChild(style);
    }
  } catch (e) {}
}

// Video bittiginde bastan oynat; tekrarlanan ended sinyallerini es gec.
var __restartPending = false;
function restart() {
  try {
    if (!__player || !__player.seekTo || __restartPending) return;
    __restartPending = true;
    __player.seekTo(0, true);
    __player.playVideo();
    __playing = true;
    hideOverlays();
    slog('restarted');
    setTimeout(function () { __restartPending = false; }, 1200);
  } catch (e) { __restartPending = false; }
}

function redirectToWatch() {
  if (__redirected) { return; }
  __redirected = true;
  __playRequested = false;
  slog('redirecting to m.youtube.com/watch');
  window.location.href = 'https://m.youtube.com/watch?v=__VIDEO_ID__&autoplay=1&mute=1&playsinline=1&rel=0&loop=1&vq=medium';
}

function onYouTubeIframeAPIReady() {
  slog('iframe-api-ready');
  hideOverlays();
  try {
    __player = new YT.Player('player', {
      videoId: '__VIDEO_ID__',
      playerVars: {
        autoplay: 1,
        controls: 0,
        loop: 1,
        playlist: '__VIDEO_ID__',
        modestbranding: 1,
        rel: 0,
        playsinline: 1,
        fs: 0,
        iv_load_policy: 3,
        disablekb: 1,
        // Fragmanlar 360p (medium) sabit: hizli baslar, agir kalite yavas aciyordu.
        vq: 'medium'
      },
      events: {
        onReady: function (e) {
          slog('player-ready');
          hideOverlays();
          // Sessize alma, YouTube'un ilk oynatma istegini kesebildigi icin
          // yalniz uygulama sessiz istediyse uygula.
          try {
            if (window.__svMuted === true) e.target.mute();
            else e.target.unMute();
          } catch (err) {}
          if (window.__svPaused !== true) {
            __playRequested = true;
            try { e.target.playVideo(); } catch (err) {}
          }
        },
        onStateChange: function (e) {
          slog('state:' + e.data);
          hideOverlays();
          if (e.data === 1) {
            __restartPending = false;
            __playRequested = false;
            __playing = true;
            try { Android.notifyPlaying(); } catch (err) {}
          }
          if (e.data === 0) {
            // Bitti: bastan baslat, beyaz play butonu kalmasin.
            if (window.__svPaused !== true) restart();
          }
          if (e.data === 2 && window.__svPaused !== true) {
            // YouTube bazen akis sirasinda beklenmedik PLAYING -> PAUSED
            // gecisi bildiriyor. Yalnizca kullanici pause istemediyse surt.
            setTimeout(function () {
              try {
                if (__player && __player.getPlayerState() === 2 && window.__svPaused !== true) {
                  __playRequested = true;
                  __player.playVideo();
                }
              } catch (err) {}
            }, 250);
          }
        },
        onError: function (e) {
          slog('player-error:' + (e.data !== undefined ? e.data : '?'));
          // Embed gercekten oynatilamazsa once mobil player'a fallback yap.
          redirectToWatch();
        }
      }
    });
  } catch (err) {
    slog('player-create-error:' + err);
    redirectToWatch();
  }
}

setTimeout(function () {
  // API hazir/oynatma talebi gonderilmis ama PLAYING callback'i gelmemisse
  // watch fallback'e gec; normal video baslangicina 6 saniyede mudahale etme.
  if (!__playing && !__playRequested) { redirectToWatch(); }
}, 12000);

setTimeout(function () {
  if (!__playing && !__redirected) {
    redirectToWatch();
  }
}, 30000);
</script>
</body>
</html>
